<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     width="100"
     height="100"
     role="img"
     aria-label="RePen India symbol">

  <!--
    RePen India — Symbol mark (first-pass vector)
    ================================================
    Geometry: 100 x 100 unit coordinate space
    Color:    #00361A (deep forest green)
    Background: transparent

    Layout
    Left  ~50 %  pen-nib form, tip pointing down
    Right ~50 %  two stacked leaf / petal forms

    The nib right-shoulder and both leaf left-spines share
    the x=48 axis, making the mark read as one unified symbol.
  -->

  <!-- PEN NIB BODY
       Cubic bezier sides give the classic inward-curved
       shoulder profile of a real nib.
       Top spans x 10-48, tip lands at (28,92). -->
  <path
    fill="#00361A"
    d="M10,8 C4,28 4,42 8,58 L28,92 L48,58 C52,42 52,28 48,8 Z"/>

  <!-- NIB CENTRE SLIT
       White line rising from just above the tip. -->
  <line
    x1="28" y1="90"
    x2="28" y2="60"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <!-- NIB BREATHER HOLE
       Small circle at the top of the slit. -->
  <circle cx="28" cy="56" r="3.5" fill="#ffffff"/>

  <!-- UPPER LEAF
       Cubic arc: spine on the left (x=48),
       bulges right to ~x84 at y29. -->
  <path
    fill="#00361A"
    d="M48,8 C96,8 96,50 48,50 Z"/>

  <!-- LOWER LEAF
       Mirror of the upper leaf in the bottom half. -->
  <path
    fill="#00361A"
    d="M48,50 C96,50 96,92 48,92 Z"/>

</svg>
